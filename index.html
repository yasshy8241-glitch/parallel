    const parseFeatures = (featuresInput) => {
      if (Array.isArray(featuresInput)) return featuresInput;
      if (!featuresInput) return [];
      return String(featuresInput).split(/[,、]/).map(s => s.trim()).filter(Boolean);
    };

    const estimateLines = (text, charsPerLine = 16) => {
      if (!text) return 0;
      return String(text)
        .split('\n')
        .reduce((sum, line) => sum + Math.max(1, Math.ceil(line.length / charsPerLine)), 0);
    };

    const getNodeHeight = (node, cardWidth = MIN_CARD_WIDTH) => {
      const charsPerLine = Math.max(14, Math.floor((cardWidth - 40) / 12));
      let baseH = 185;
      if (node.title) {
        const titleLines = estimateLines(node.title, Math.max(10, charsPerLine - 4));
        if (titleLines > 1) baseH += (titleLines - 1) * 20;
      }
      if (node.description) {
        baseH += 12 + estimateLines(node.description, charsPerLine) * 18;
      }
      if (node.aiWith) {
        baseH += 34 + estimateLines(node.aiWith, charsPerLine - 2) * 16;
      }
      if (node.aiWithout) {
        baseH += 34 + estimateLines(node.aiWithout, charsPerLine - 2) * 16;
      }
      const feats = parseFeatures(node.features || node.feature);
      if (feats.length > 0) {
        const totalChars = feats.reduce((sum, f) => sum + f.length + 3, 0);
        const tagRows = Math.max(1, Math.ceil(totalChars / Math.max(16, charsPerLine)));
        baseH += 14 + tagRows * 24;
      }
      return Math.max(300, baseH);
    };

      const h = parseInt(parts[0], 10);

      if (isNaN(h) || isNaN(m)) return 9 * 60;
      return Math.max(0, Math.min(24 * 60, h * 60 + m));

        const activeId = cleanTimelines.some(t => t.id === raw.activeTimelineId)
          ? raw.activeTimelineId
          : cleanTimelines[0].id;
        const treeFeats = cleanTimelines.flatMap(t => getAllFeaturesFromTree(t.treeData));
        const masterFeatures = Array.from(new Set([...(raw.masterFeatures || []), ...treeFeats]));
        const situationStocks = Array.isArray(raw.situationStocks) ? raw.situationStocks : [];
        return {
          timelines: cleanTimelines,
          activeTimelineId: activeId,
          masterFeatures,
          situationStocks
        };
      }
      // 旧フォーマット(v1)からの自動移行
      const legacyTree = sanitizeTree(raw.treeData || (raw.id && raw.title ? raw : initialTreeData));
      const treeFeats = getAllFeaturesFromTree(legacyTree);
      return {
        timelines: [
          {
            id: 'tl_default',
            name: 'Ver 1.0 (メイン)',
            treeData: legacyTree,
            timelineStartHour: raw.timelineStartHour ?? 0,
            timelineEndHour: raw.timelineEndHour ?? 24
          }
        ],
        activeTimelineId: 'tl_default',
        masterFeatures: Array.from(new Set([...initialMasterFeatures, ...treeFeats])),
        situationStocks: initialSituationStocks
      };
    };

    const getColorStroke = (colorClass) => {
      switch (colorClass) {
        case 'bg-blue-50': return '#93c5fd';
        case 'bg-amber-50': return '#fcd34d';
        case 'bg-emerald-50': return '#6ee7b7';
        case 'bg-purple-50': return '#c084fc';
        case 'bg-rose-50': return '#fda4af';
        default: return '#cbd5e1';
      }
    };

    const getCardFillColor = (colorClass) => {
      switch (colorClass) {
        case 'bg-blue-50': return '#eff6ff';
        case 'bg-amber-50': return '#fffbeb';
        case 'bg-emerald-50': return '#ecfdf5';
        case 'bg-purple-50': return '#faf5ff';
        case 'bg-rose-50': return '#fff1f2';
        default: return '#ffffff';
      }
    };

    const wrapCanvasText = (ctx, text, maxWidth) => {
      if (!text) return [];
      const paragraphs = String(text).split('\n');
      const lines = [];
      for (const para of paragraphs) {
        let currentLine = '';
        for (const char of para) {
          const testLine = currentLine + char;
          if (ctx.measureText(testLine).width > maxWidth && currentLine.length > 0) {
            lines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);
      }
      return lines;
    };

    // --- Tree Operation Helpers ---
    const flattenNodes = (node, depth = 0, list = []) => {
      if (!node) return list;
      list.push({ id: node.id, title: node.title, endTime: node.endTime, color: node.color, depth });
      if (node.children) {
        node.children.forEach(c => flattenNodes(c, depth + 1, list));
      }
      return list;
    };

    const addNodeToTree = (node, parentId, newNode) => {
      if (node.id === parentId) {
        return { ...node, children: [...(node.children || []), newNode] };
      }
      if (!node.children) return node;
      return {
        ...node,
        children: node.children.map(child => addNodeToTree(child, parentId, newNode))
      };
    };

    const updateNodeInTree = (node, targetId, updateData) => {
      if (node.id === targetId) {
        return { ...node, ...updateData };
      }
      if (!node.children) return node;
      return {
        ...node,
        children: node.children.map(child => updateNodeInTree(child, targetId, updateData))
      };
    };

    const deleteNodeFromTree = (node, targetId) => {
      if (!node.children) return node;
      return {
        ...node,
        children: node.children
          .filter(child => child.id !== targetId)
          .map(child => deleteNodeFromTree(child, targetId))
      };
    };

    const renameFeatureInTree = (node, oldName, newName) => {
      const currentFeats = parseFeatures(node.features || node.feature);
      const updatedFeats = currentFeats.map(f => f === oldName ? newName : f);
      const updatedChildren = node.children ? node.children.map(c => renameFeatureInTree(c, oldName, newName)) : [];
      return { ...node, features: Array.from(new Set(updatedFeats)), children: updatedChildren };
    };

    const deleteFeatureFromTree = (node, targetName) => {
      const currentFeats = parseFeatures(node.features || node.feature);
      const updatedFeats = currentFeats.filter(f => f !== targetName);
      const updatedChildren = node.children ? node.children.map(c => deleteFeatureFromTree(c, targetName)) : [];
      return { ...node, features: updatedFeats, children: updatedChildren };
    };

    const pasteNodeToParent = (node, targetParentId, nodeToPaste) => {
      const singleClonedNode = {
        ...sanitizeTree(nodeToPaste),
        id: generateId('node'),
        title: nodeToPaste.title,
        children: []
      };

      if (node.id === targetParentId) {
        return {
          ...node,
          children: [...(node.children || []), singleClonedNode]
        };
      }
      if (!node.children) return node;
      return {
        ...node,
        children: node.children.map(child => pasteNodeToParent(child, targetParentId, nodeToPaste))
      };
    };

    const reorderSiblingInTree = (node, targetId, direction) => {
      if (!node.children) return node;
      const idx = node.children.findIndex(c => c.id === targetId);
      if (idx !== -1) {
        const newIdx = idx + direction;
        if (newIdx >= 0 && newIdx < node.children.length) {
          const newChildren = [...node.children];
          const [moved] = newChildren.splice(idx, 1);
          newChildren.splice(newIdx, 0, moved);
          return { ...node, children: newChildren };
        }
        return node;
      }
      return {
        ...node,
        children: node.children.map(c => reorderSiblingInTree(c, targetId, direction))
      };
    };

    const promoteNodeInTree = (root, targetId) => {
      const findParentAndChild = (current, parent = null) => {
        if (current.id === targetId) return { parent, child: current };
        if (!current.children) return null;
        for (const c of current.children) {
          const res = findParentAndChild(c, current);
          if (res) return res;
        }
        return null;
      };

      const found = findParentAndChild(root);
      if (!found || !found.parent || found.parent.id === root.id) return root;

      const { parent: targetParent, child: targetNode } = found;

      const findGrandParent = (current, pId) => {
        if (!current.children) return null;
        if (current.children.some(c => c.id === pId)) return current;
        for (const c of current.children) {
          const res = findGrandParent(c, pId);
          if (res) return res;
        }
        return null;
      };

      const grandParent = findGrandParent(root, targetParent.id);
      if (!grandParent) return root;

      const removeFromParent = (n) => {
        if (n.id === targetParent.id) {
          return { ...n, children: n.children.filter(c => c.id !== targetId) };
        }
        if (!n.children) return n;
        return { ...n, children: n.children.map(removeFromParent) };
      };

      const updatedTree = removeFromParent(root);

      const insertIntoGrandParent = (n) => {
        if (n.id === grandParent.id) {
          const pIdx = n.children.findIndex(c => c.id === targetParent.id);
          const newChildren = [...n.children];
          newChildren.splice(pIdx + 1, 0, targetNode);
          return { ...n, children: newChildren };
        }
        if (!n.children) return n;
        return { ...n, children: n.children.map(insertIntoGrandParent) };
      };

      return insertIntoGrandParent(updatedTree);
    };

    const demoteNodeInTree = (root, targetId) => {
      const findParentAndSiblings = (current) => {
        if (!current.children) return null;
        const idx = current.children.findIndex(c => c.id === targetId);
        if (idx !== -1) return { parent: current, index: idx };
        for (const c of current.children) {
          const res = findParentAndSiblings(c);
          if (res) return res;
        }
        return null;
      };

      const found = findParentAndSiblings(root);
      if (!found || found.index === 0) return root;

      const { parent, index } = found;
      const targetNode = parent.children[index];
      const prevSibling = parent.children[index - 1];

      const updateTree = (n) => {
        if (n.id === parent.id) {
          const newChildren = n.children.filter(c => c.id !== targetId).map(c => {
            if (c.id === prevSibling.id) {
              return {
                ...c,
                children: [...(c.children || []), targetNode]
              };
            }
            return c;
          });
          return { ...n, children: newChildren };
        }
        if (!n.children) return n;
        return { ...n, children: n.children.map(updateTree) };
      };

      return updateTree(root);
    };

    // --- Tree Layout Computation ---
    const computeTreeLayout = (tree, timelineStartHour = 0, dragOverride = null) => {
      const nodes = [];
      const links = [];
      const metaMap = new Map();

      const getEffectiveTimes = (n) => {
        if (dragOverride && dragOverride.id === n.id) {
          return {
            startTime: dragOverride.previewStartTime,
            endTime: dragOverride.previewEndTime
          };
        }
        return {
          startTime: n.startTime || '09:00',
          endTime: n.endTime || '09:30'
        };
      };

      const computeHeight = (n) => {
        const { startTime, endTime } = getEffectiveTimes(n);
        const startMin = timeToMinutes(startTime);
        const endMin = timeToMinutes(endTime);
        const durationMin = Math.max(15, endMin - startMin);
        const width = Math.max(MIN_CARD_WIDTH, (durationMin / 60) * PIXELS_PER_HOUR);
        const nodeH = getNodeHeight(n, width);

        let subtreeH;
        if (!n.children || n.children.length === 0) {
          subtreeH = nodeH + GAP_Y;
        } else {
          const childrenSum = n.children.reduce((sum, child) => sum + computeHeight(child), 0);
          subtreeH = Math.max(childrenSum, nodeH + GAP_Y);
        }

        metaMap.set(n.id, { width, nodeH, subtreeH, startMin, durationMin, startTime, endTime });
        return subtreeH;
      };
      computeHeight(tree);

      const assignCoords = (n, currentY, minX = 60) => {
        const meta = metaMap.get(n.id);
        const timeBasedX = ((meta.startMin - timelineStartHour * 60) / 60) * PIXELS_PER_HOUR + 60;
        const x = Math.max(timeBasedX, minX);
        const parentRightX = x + meta.width;

        let y;
        if (n.children && n.children.length > 0) {
          let childY = currentY;
          const childCoords = n.children.map(child => {
            const cPos = assignCoords(child, childY, parentRightX + MIN_GAP_X);
            childY += metaMap.get(child.id).subtreeH;
            return cPos;
          });
          y = (childCoords[0].y + childCoords[childCoords.length - 1].y) / 2;

          childCoords.forEach((cPos, idx) => {
            const child = n.children[idx];
            links.push({
              id: `${n.id}-${child.id}`,
              startX: parentRightX,
              startY: y,
              endX: cPos.x,
              endY: cPos.y,
              colorClass: child.color || 'bg-white'
            });
          });
        } else {
          y = currentY + (meta.nodeH / 2);
        }

        nodes.push({
          node: n,
          x,
          y,
          width: meta.width,
          height: meta.nodeH,
          displayStartTime: meta.startTime,
          displayEndTime: meta.endTime
        });

        return { x, y };
      };

      assignCoords(tree, TOP_MARGIN, 60);

      const maxY = Math.max(...nodes.map(item => item.y + item.height / 2), 850);
      return { nodes, links, totalHeight: maxY + GAP_Y };
    };

      // ルーム接続 & リアルタイム同期監視
      useEffect(() => {
        if (!isAuthenticated) return;

        const roomKey = roomId.trim() || 'default-room';
        updateUrlRoomParam(roomKey);

        const cached = loadFromLocalStorage(roomKey);
        if (cached) {
          setWorkspace(cached);
        }

        if (!db) {
          if (!cached) {
            const defWs = createDefaultWorkspace();
            setWorkspace(defWs);
            saveToLocalStorage(roomKey, defWs);
          }
          setSyncStatus('local');
          return;
        }

        let unsubscribe = () => {};
        setSyncStatus('syncing');

        const connectAndListen = async () => {
          try {
            if (auth && !auth.currentUser) {
              try {
                await signInAnonymously(auth);
              } catch (e) {
                console.warn("Auth fallback handling:", e);
              }
            }

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'story_branches', roomKey);

            unsubscribe = onSnapshot(docRef, (snapshot) => {
              if (snapshot.exists()) {
                const data = snapshot.data();
                if (data.updatedBy !== CLIENT_ID || !workspaceRef.current) {
                  const normalized = normalizeWorkspaceData(data);
                  setWorkspace(normalized);
                  saveToLocalStorage(roomKey, normalized);
                }
                setSyncStatus('synced');
              } else {
                const seedWs = cached || createDefaultWorkspace();
                setDoc(docRef, {
                  ...seedWs,
                  updatedAt: Date.now(),
                  updatedBy: CLIENT_ID
                }).catch(e => console.warn("Doc init warn:", e));
                setWorkspace(seedWs);
                saveToLocalStorage(roomKey, seedWs);
                setSyncStatus('synced');
              }
            }, (error) => {
              console.warn("Snapshot error:", error);
              setSyncStatus('local');
              setWorkspace(prev => prev || cached || createDefaultWorkspace());
            });
          } catch (err) {
            console.warn("Connect error:", err);
            setSyncStatus('local');
            setWorkspace(prev => prev || cached || createDefaultWorkspace());
          }
        };

        connectAndListen();
        return () => unsubscribe();
      }, [roomId, isAuthenticated]);

      const syncToCloudAndLocal = useCallback((nextWorkspace) => {
        const cleanWs = normalizeWorkspaceData(nextWorkspace);
        const roomKey = roomId.trim() || 'default-room';
        saveToLocalStorage(roomKey, cleanWs);

        if (!db) return;
        setSyncStatus('saving');
        if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
        syncTimeoutRef.current = setTimeout(() => {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'story_branches', roomKey);
            setDoc(docRef, {
              ...cleanWs,
              updatedAt: Date.now(),
              updatedBy: CLIENT_ID
            }).then(() => {
              setSyncStatus('synced');
              setLastSavedText(formatCurrentTime());
            }).catch(err => {
              console.warn("Cloud save warning:", err.message);
              setSyncStatus('local');
            });
          } catch (e) {
            console.warn("Cloud save skipped:", e);
            setSyncStatus('local');
          }
        }, 300);
      }, [roomId]);

      // ワークスペース全体を更新する共通ディスパッチャー
      const dispatchWorkspaceUpdate = useCallback((updater, options = {}) => {
        const { recordHistory = true } = options;
        setWorkspace(prev => {
          if (!prev) return prev;
          const next = typeof updater === 'function' ? updater(prev) : updater;
          if (next === prev) return prev;
          if (recordHistory) {
            setPastHistory(h => [...h.slice(-(MAX_HISTORY - 1)), prev]);
            setFutureHistory([]);
          }
          syncToCloudAndLocal(next);
          return next;
        });
      }, [syncToCloudAndLocal]);

      // アクティブなタイムラインの treeData のみを更新するヘルパー
      const dispatchTreeUpdate = useCallback((treeUpdater, options = {}) => {
        dispatchWorkspaceUpdate(prev => {
          const targetId = prev.activeTimelineId;
          const nextTimelines = prev.timelines.map(tl => {
            if (tl.id !== targetId) return tl;
            const nextTree = typeof treeUpdater === 'function' ? treeUpdater(tl.treeData) : treeUpdater;
            return { ...tl, treeData: nextTree };
          });
          return { ...prev, timelines: nextTimelines };
        }, options);
      }, [dispatchWorkspaceUpdate]);

      // Undo / Redo
      const handleUndo = useCallback(() => {
        setPastHistory(prevPast => {
          if (prevPast.length === 0) return prevPast;
          const previousWs = prevPast[prevPast.length - 1];
          const newPast = prevPast.slice(0, -1);
          if (workspaceRef.current) {
            setFutureHistory(prevFuture => [workspaceRef.current, ...prevFuture.slice(0, MAX_HISTORY - 1)]);
          }
          setWorkspace(previousWs);
          syncToCloudAndLocal(previousWs);
          showToast('元に戻しました');
          return newPast;
        });
      }, [syncToCloudAndLocal, showToast]);

      const handleRedo = useCallback(() => {
        setFutureHistory(prevFuture => {
          if (prevFuture.length === 0) return prevFuture;
          const nextWs = prevFuture[0];
          const newFuture = prevFuture.slice(1);
          if (workspaceRef.current) {
            setPastHistory(prevPast => [...prevPast.slice(-(MAX_HISTORY - 1)), workspaceRef.current]);
          }
          setWorkspace(nextWs);
          syncToCloudAndLocal(nextWs);
          showToast('やり直しました');
          return newFuture;
        });
      }, [syncToCloudAndLocal, showToast]);

      // キーボードショートカット (Ctrl+Z / Ctrl+Y)
      useEffect(() => {
        if (!isAuthenticated) return;
        const handleKeyDown = (e) => {
          const tag = e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            if (e.shiftKey) handleRedo();
            else handleUndo();
          } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
            e.preventDefault();
            handleRedo();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isAuthenticated, handleUndo, handleRedo]);

      // Ctrl + ホイールズーム
      useEffect(() => {
        const el = mainScrollRef.current;
        if (!el) return;
        const handleWheel = (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.1 : -0.1;
            setZoom(prev => Math.min(1.5, Math.max(0.5, Math.round((prev + delta) * 10) / 10)));
          }
        };
        el.addEventListener('wheel', handleWheel, { passive: false });
        return () => el.removeEventListener('wheel', handleWheel);
      }, [isAuthenticated, activeMainTab, workspace !== null]);

      // ========================================================================
      // ★ タイムラインVer 管理ハンドラー
      // ========================================================================
      const handleSwitchTimeline = (tlId) => {
        dispatchWorkspaceUpdate(prev => ({ ...prev, activeTimelineId: tlId }), { recordHistory: false });
        setActiveMainTab('timeline');
      };

      const openCreateVersionModal = () => {
        const nextNum = (workspace?.timelines?.length || 1) + 1;
        setVersionModal({
          isOpen: true,
          mode: 'create',
          targetId: null,
          name: `Ver ${nextNum}.0`,
          baseMode: 'clone'
        });
      };

      const openRenameVersionModal = (tl) => {
        setVersionModal({
          isOpen: true,
          mode: 'rename',
          targetId: tl.id,
          name: tl.name,
          baseMode: 'blank'
        });
      };

      const openDeleteVersionModal = (tl) => {
        setVersionModal({
          isOpen: true,
          mode: 'delete',
          targetId: tl.id,
          name: tl.name,
          baseMode: 'blank'
        });
      };

      const handleConfirmVersionModal = (e) => {
        e?.preventDefault();
        if (!workspace) return;

        if (versionModal.mode === 'create') {
          const trimmed = versionModal.name.trim() || `Ver ${workspace.timelines.length + 1}.0`;
          const newId = generateId('tl');
          const baseTree = versionModal.baseMode === 'clone' && activeTimeline
            ? JSON.parse(JSON.stringify(sanitizeTree(activeTimeline.treeData)))
            : createBlankTreeData(trimmed);
          const newTl = {
            id: newId,
            name: trimmed,
            treeData: baseTree,
            timelineStartHour: activeTimeline?.timelineStartHour ?? 0,
            timelineEndHour: activeTimeline?.timelineEndHour ?? 24
          };
          dispatchWorkspaceUpdate(prev => ({
            ...prev,
            timelines: [...prev.timelines, newTl],
            activeTimelineId: newId
          }));
          showToast(`タイムライン「${trimmed}」を作成しました`);
        } else if (versionModal.mode === 'rename') {
          const trimmed = versionModal.name.trim();
          if (!trimmed) return;
          dispatchWorkspaceUpdate(prev => ({
            ...prev,
            timelines: prev.timelines.map(t => t.id === versionModal.targetId ? { ...t, name: trimmed } : t)
          }));
          showToast(`バージョン名を「${trimmed}」に変更しました`);
        } else if (versionModal.mode === 'delete') {
          if (workspace.timelines.length <= 1) {
            showToast('最後の1つのタイムラインは削除できません');
            return;
          }
          dispatchWorkspaceUpdate(prev => {
            const remaining = prev.timelines.filter(t => t.id !== versionModal.targetId);
            const nextActive = prev.activeTimelineId === versionModal.targetId ? remaining[0].id : prev.activeTimelineId;
            return { ...prev, timelines: remaining, activeTimelineId: nextActive };
          });
          showToast(`タイムライン「${versionModal.name}」を削除しました`);
        }

        setVersionModal({ isOpen: false, mode: 'create', targetId: null, name: '', baseMode: 'clone' });
      };

      // ========================================================================
      // ★ 活用機能マスター管理ハンドラー
      // ========================================================================
      const handleAddMasterFeatures = (rawText) => {
        const added = parseFeatures(rawText);
        if (added.length === 0) return;
        dispatchWorkspaceUpdate(prev => ({
          ...prev,
          masterFeatures: Array.from(new Set([...(prev.masterFeatures || []), ...added]))
        }));
        setMasterFeatureInput('');
        showToast(`活用機能（${added.join(', ')}）を登録しました`);
      };

      const handleRenameMasterFeature = (oldName, newName) => {
        const trimmed = newName.trim();
        if (!trimmed || trimmed === oldName) {
          setEditingMasterFeat(null);
          return;
        }
        dispatchWorkspaceUpdate(prev => ({
          ...prev,
          masterFeatures: Array.from(new Set((prev.masterFeatures || []).map(f => f === oldName ? trimmed : f))),
          timelines: prev.timelines.map(tl => ({
            ...tl,
            treeData: renameFeatureInTree(tl.treeData, oldName, trimmed)
          })),
          situationStocks: (prev.situationStocks || []).map(st => ({
            ...st,
            features: Array.from(new Set((st.features || []).map(f => f === oldName ? trimmed : f)))
          }))
        }));
        setEditingMasterFeat(null);
        showToast(`機能名を「${trimmed}」に変更しました`);
      };

      const handleDeleteMasterFeature = (targetName) => {
        dispatchWorkspaceUpdate(prev => ({
          ...prev,
          masterFeatures: (prev.masterFeatures || []).filter(f => f !== targetName),
          timelines: prev.timelines.map(tl => ({
            ...tl,
            treeData: deleteFeatureFromTree(tl.treeData, targetName)
          })),
          situationStocks: (prev.situationStocks || []).map(st => ({
            ...st,
            features: (st.features || []).filter(f => f !== targetName)
          }))
        }));
        showToast(`活用機能「${targetName}」を削除しました`);
      };

      // ========================================================================
      // ★ シチュエーションストック管理ハンドラー
      // ========================================================================
      const openCreateStockModal = () => {
        setStockForm({
          title: '',
          description: '',
          features: [],
          aiWith: '',
          aiWithout: '',
          color: 'bg-blue-50',
          durationMin: 30
        });
        setStockModal({ isOpen: true, editId: null });
      };

      const openEditStockModal = (stock) => {
        setStockForm({
          title: stock.title || '',
          description: stock.description || '',
          features: parseFeatures(stock.features),
          aiWith: stock.aiWith || '',
          aiWithout: stock.aiWithout || '',
          color: stock.color || 'bg-blue-50',
          durationMin: stock.durationMin || 30
        });
        setStockModal({ isOpen: true, editId: stock.id });
      };

      const handleSaveStock = (e) => {
        e.preventDefault();
        const title = stockForm.title.trim() || '無題のシチュエーション';
        const durationMin = Math.max(15, Number(stockForm.durationMin) || 30);

        if (stockModal.editId) {
          dispatchWorkspaceUpdate(prev => ({
            ...prev,
            situationStocks: (prev.situationStocks || []).map(st =>
              st.id === stockModal.editId
                ? { ...st, ...stockForm, title, durationMin }
                : st
            )
          }));
          showToast(`ストック「${title}」を更新しました`);
        } else {
          const newStock = {
            id: generateId('stock'),
            ...stockForm,
            title,
            durationMin
          };
          dispatchWorkspaceUpdate(prev => ({
            ...prev,
            situationStocks: [...(prev.situationStocks || []), newStock]
          }));
          showToast(`ストック「${title}」を追加しました`);
        }
        setStockModal({ isOpen: false, editId: null });
      };

      const handleDeleteStock = (stockId) => {
        dispatchWorkspaceUpdate(prev => ({
          ...prev,
          situationStocks: (prev.situationStocks || []).filter(st => st.id !== stockId)
        }));
        showToast('シチュエーションストックを削除しました');
      };

      const handleInsertStockToTimeline = (stock) => {
        if (!treeData) return;
        const parentId = stockInsertTarget[stock.id] || treeData.id;
        const parentInfo = flatActiveNodes.find(n => n.id === parentId) || flatActiveNodes[0];
        const startTime = parentInfo?.endTime || '09:00';
        const endTime = minutesToTime(timeToMinutes(startTime) + (stock.durationMin || 30));

        const newNode = {
          id: generateId('node'),
          title: stock.title,
          description: stock.description || '',
          features: parseFeatures(stock.features),
          aiWith: stock.aiWith || '',
          aiWithout: stock.aiWithout || '',
          color: stock.color || 'bg-white',
          startTime,
          endTime,
          children: []
        };

        dispatchTreeUpdate(prev => addNodeToTree(prev, parentId, newNode));
        setActiveMainTab('timeline');
        showToast(`「${stock.title}」を「${parentInfo?.title || 'ルート'}」の配下に追加しました`);
      };

      // ========================================================================
      // ★ ツリー操作・エクスポート・ドラッグハンドラー
      // ========================================================================
      const handleExportCSV = () => {
        if (!treeData) return;
        const rows = [
          ['階層パス', '分岐タイトル', '開始時間', '終了時間', '概要・シチュエーション', '活用機能', '🟢 AIあり(〇〇さん)', '🔴 AIなし(××さん)']
        ];

        const traverse = (node, parentPath = '') => {
          const currentPath = parentPath ? `${parentPath} > ${node.title}` : node.title;
          const feats = parseFeatures(node.features || node.feature).join(', ');
          rows.push([
            `"${currentPath.replace(/"/g, '""')}"`,
            `"${(node.title || '').replace(/"/g, '""')}"`,
            `"${node.startTime || ''}"`,
            `"${node.endTime || ''}"`,
            `"${(node.description || '').replace(/"/g, '""')}"`,
            `"${feats.replace(/"/g, '""')}"`,
            `"${(node.aiWith || '').replace(/"/g, '""')}"`,
            `"${(node.aiWithout || '').replace(/"/g, '""')}"`
          ]);
          if (node.children) node.children.forEach(child => traverse(child, currentPath));
        };

        traverse(treeData);

        const csvContent = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `parallel_${roomId}_${activeTimeline?.name || 'v1'}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('スプレッドシート用CSVファイルを出力しました。');
      };

      const handleExportImage = () => {
        if (!treeData) return;
        const layout = computeTreeLayout(treeData, timelineStartHour);

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        layout.nodes.forEach(item => {
          if (item.x < minX) minX = item.x;
          if (item.x + item.width > maxX) maxX = item.x + item.width;
          if (item.y - item.height / 2 < minY) minY = item.y - item.height / 2;
          if (item.y + item.height / 2 > maxY) maxY = item.y + item.height / 2;
        });

        if (!isFinite(minX)) { minX = 0; maxX = 800; minY = 0; maxY = 600; }

        const padX = 48, rulerHeight = 44, padTop = 28, padBottom = 48;
        const width = Math.max(640, (maxX - minX) + padX * 2);
        const height = Math.max(420, rulerHeight + (maxY - minY) + padTop + padBottom);
        const scale = Math.min(2.5, 8192 / Math.max(width, height));

        const canvas = document.createElement('canvas');
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        const fontSans = '-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif';
        const fontMono = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';

        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(0, 0, width, height);

        const toCanvasX = (x) => x - minX + padX;
        const toCanvasY = (y) => y - minY + rulerHeight + padTop;

        const startHourVisible = Math.max(timelineStartHour, Math.floor((minX - 60) / PIXELS_PER_HOUR) + timelineStartHour);
        const endHourVisible = Math.min(timelineEndHour, Math.ceil((maxX - 60) / PIXELS_PER_HOUR) + timelineStartHour + 1);

        for (let hour = startHourVisible; hour <= endHourVisible; hour++) {
          const gx = toCanvasX((hour - timelineStartHour) * PIXELS_PER_HOUR + 60);
          ctx.strokeStyle = 'rgba(203, 213, 225, 0.55)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(gx, rulerHeight);
          ctx.lineTo(gx, height);
          ctx.stroke();
        }

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, rulerHeight);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, rulerHeight);
        ctx.lineTo(width, rulerHeight);
        ctx.stroke();

        ctx.font = `700 12px ${fontMono}`;
        for (let hour = startHourVisible; hour <= endHourVisible; hour++) {
          const rx = toCanvasX((hour - timelineStartHour) * PIXELS_PER_HOUR + 60);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(rx, 0);
          ctx.lineTo(rx, rulerHeight);
          ctx.stroke();
          ctx.fillStyle = '#475569';
          ctx.fillText(`${String(hour).padStart(2, '0')}:00`, rx + 8, 27);
        }

        layout.links.forEach(link => {
          const sx = toCanvasX(link.startX), sy = toCanvasY(link.startY);
          const ex = toCanvasX(link.endX), ey = toCanvasY(link.endY);
          const c1x = sx + Math.max(30, (ex - sx) / 2);
          const c2x = ex - Math.max(30, (ex - sx) / 2);

          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.bezierCurveTo(c1x, sy, c2x, ey, ex, ey);
          ctx.strokeStyle = getColorStroke(link.colorClass);
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.bezierCurveTo(c1x, sy, c2x, ey, ex, ey);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
        });

        layout.nodes.forEach(item => {
          const { node, width: w, height: h } = item;
          const x = toCanvasX(item.x);
          const y = toCanvasY(item.y - h / 2);
          const innerW = w - 28;

          ctx.save();
          ctx.fillStyle = getCardFillColor(node.color);
          ctx.shadowColor = 'rgba(15, 23, 42, 0.08)';
          ctx.shadowBlur = 10;
          ctx.shadowOffsetY = 3;
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 16);
          ctx.fill();
          ctx.restore();

          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 16);
          ctx.stroke();

          let cursorY = y + 22;
          ctx.fillStyle = '#0f172a';
          ctx.font = `800 13.5px ${fontSans}`;
          const titleLines = wrapCanvasText(ctx, node.title || '無題', innerW - 82).slice(0, 2);
          titleLines.forEach((line, i) => ctx.fillText(line, x + 14, cursorY + i * 17));

          const timeLabel = `${node.startTime || '09:00'}-${node.endTime || '09:30'}`;
          ctx.font = `700 10px ${fontMono}`;
          const badgeW = Math.max(76, ctx.measureText(timeLabel).width + 12);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.06)';
          ctx.beginPath();
          ctx.roundRect(x + w - badgeW - 12, y + 11, badgeW, 20, 5);
          ctx.fill();
          ctx.fillStyle = '#334155';
          ctx.fillText(timeLabel, x + w - badgeW - 6, y + 24.5);

          cursorY += Math.max(titleLines.length * 17, 22) + 4;
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.1)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 14, cursorY);
          ctx.lineTo(x + w - 14, cursorY);
          ctx.stroke();
          cursorY += 14;

          if (node.description) {
            ctx.fillStyle = '#475569';
            ctx.font = `500 11.5px ${fontSans}`;
            wrapCanvasText(ctx, node.description, innerW).forEach(line => {
              if (cursorY + 15 < y + h - 36) {
                ctx.fillText(line, x + 14, cursorY);
                cursorY += 15.5;
              }
            });
            cursorY += 4;
          }

          if (node.aiWith) {
            ctx.font = `500 11px ${fontSans}`;
            const withLines = wrapCanvasText(ctx, node.aiWith, innerW - 16);
            const boxH = 22 + withLines.length * 14.5;
            if (cursorY + boxH < y + h - 32) {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
              ctx.beginPath();
              ctx.roundRect(x + 14, cursorY, innerW, boxH, 8);
              ctx.fill();
              ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
              ctx.lineWidth = 1;
              ctx.stroke();
              ctx.fillStyle = '#047857';
              ctx.font = `700 11px ${fontSans}`;
              ctx.fillText('🟢 AIあり (〇〇さん)', x + 22, cursorY + 14);
              ctx.fillStyle = '#334155';
              ctx.font = `500 11px ${fontSans}`;
              withLines.forEach((line, idx) => ctx.fillText(line, x + 22, cursorY + 29 + idx * 14.5));
              cursorY += boxH + 7;
            }
          }

          if (node.aiWithout) {
            ctx.font = `500 11px ${fontSans}`;
            const withoutLines = wrapCanvasText(ctx, node.aiWithout, innerW - 16);
            const boxH = 22 + withoutLines.length * 14.5;
            if (cursorY + boxH < y + h - 32) {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
              ctx.beginPath();
              ctx.roundRect(x + 14, cursorY, innerW, boxH, 8);
              ctx.fill();
              ctx.strokeStyle = 'rgba(244, 63, 94, 0.35)';
              ctx.lineWidth = 1;
              ctx.stroke();
              ctx.fillStyle = '#be123c';
              ctx.font = `700 11px ${fontSans}`;
              ctx.fillText('🔴 AIなし (××さん)', x + 22, cursorY + 14);
              ctx.fillStyle = '#334155';
              ctx.font = `500 11px ${fontSans}`;
              withoutLines.forEach((line, idx) => ctx.fillText(line, x + 22, cursorY + 29 + idx * 14.5));
              cursorY += boxH + 8;
            }
          }

          const feats = parseFeatures(node.features || node.feature);
          if (feats.length > 0) {
            let tagX = x + 14;
            let tagY = Math.max(cursorY + 2, y + h - 30);
            ctx.font = `700 10px ${fontSans}`;
            feats.forEach(f => {
              const tw = ctx.measureText(f).width + 14;
              if (tagX + tw > x + w - 14 && tagX > x + 14) {
                tagX = x + 14;
                tagY += 22;
              }
              if (tagY + 18 <= y + h - 10) {
                ctx.fillStyle = '#eef2ff';
                ctx.beginPath();
                ctx.roundRect(tagX, tagY, tw, 18, 5);
                ctx.fill();
                ctx.strokeStyle = 'rgba(129, 140, 248, 0.45)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#4338ca';
                ctx.fillText(f, tagX + 7, tagY + 12.5);
                tagX += tw + 6;
              }
            });
          }
        });

        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.setAttribute('download', `parallel_${roomId}_${activeTimeline?.name || 'v1'}_${new Date().toISOString().slice(0, 10)}.png`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('最適化された高画質PNGを出力しました。');
      };

      const handleExportJSON = () => {
        if (!workspace) return;
        const exportObject = {
          version: '2.0',
          roomId,
          ...normalizeWorkspaceData(workspace)
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `parallel_backup_${roomId}_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('全バージョン・ストックを含むJSONを保存しました。');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const fileReader = new FileReader();
        fileReader.readAsText(file, "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const normalized = normalizeWorkspaceData(parsed);
            dispatchWorkspaceUpdate(normalized);
            showToast('保存ファイルからデータを復元・自動保存しました。');
          } catch (err) {
            showToast('ファイルの読み込みに失敗しました。');

          if (fileInputRef.current) fileInputRef.current.value = '';
        };
      };

      const updateFormAndAutoSave = (updatedFields) => {
        setFormData(prevForm => {
          const nextForm = { ...prevForm, ...updatedFields };

          if ('startTime' in updatedFields && nextForm.startTime) {
            const sMin = timeToMinutes(nextForm.startTime);
            const eMin = timeToMinutes(nextForm.endTime);
            if (eMin <= sMin) nextForm.endTime = minutesToTime(Math.min(23 * 60 + 59, sMin + 15));
          } else if ('endTime' in updatedFields && nextForm.endTime) {
            const sMin = timeToMinutes(nextForm.startTime);
            const eMin = timeToMinutes(nextForm.endTime);
            if (eMin <= sMin) nextForm.startTime = minutesToTime(Math.max(0, eMin - 15));
          }

          if (modalState.isOpen && modalState.type === 'edit' && modalState.targetNodeId) {
            const shouldRecord = !modalHistoryRecordedRef.current;
            modalHistoryRecordedRef.current = true;
            dispatchWorkspaceUpdate(prev => {
              const nextTimelines = prev.timelines.map(tl => {
                if (tl.id !== prev.activeTimelineId) return tl;
                return {
                  ...tl,
                  treeData: updateNodeInTree(tl.treeData, modalState.targetNodeId, {
                    title: nextForm.title || '無題の分岐',
                    description: nextForm.description,
                    features: nextForm.features,
                    aiWith: nextForm.aiWith,
                    aiWithout: nextForm.aiWithout,
                    color: nextForm.color,
                    startTime: nextForm.startTime,
                    endTime: nextForm.endTime
                  })
                };
              });
              const nextMaster = Array.from(new Set([...(prev.masterFeatures || []), ...(nextForm.features || [])]));
              return { ...prev, timelines: nextTimelines, masterFeatures: nextMaster };
            }, { recordHistory: shouldRecord });
          }
          return nextForm;
        });
      };

      const handleAddClick = (parentNode) => {
        const newId = generateId('node');
        const defaultStart = parentNode.endTime || '09:30';
        const defaultEnd = minutesToTime(timeToMinutes(defaultStart) + 30);
        const newNode = {
          id: newId,

          description: '',
          features: [],
          aiWith: '',
          aiWithout: '',

          endTime: defaultEnd,

        dispatchTreeUpdate(prev => addNodeToTree(prev, parentNode.id, newNode));
        modalHistoryRecordedRef.current = true;

        setFormData({
          title: newNode.title,
          description: '',
          features: [],
          newFeatureText: '',
          aiWith: '',
          aiWithout: '',

        showToast(`「${copiedNode.title}」を「${targetParentNode.title}」の配下に複製しました。`);
      };

      const handleReorderClick = (nodeId, dir) => dispatchTreeUpdate(prev => reorderSiblingInTree(prev, nodeId, dir));
      const handlePromoteClick = (nodeId) => dispatchTreeUpdate(prev => promoteNodeInTree(prev, nodeId));

      const handlePointerDown = (e, node) => {
        if (e.target.closest('button') || e.target.closest('input')) return;
        e.stopPropagation();
        e.currentTarget.setPointerCapture(e.pointerId);

        const startMin = timeToMinutes(node.startTime || '09:00');
        const endMin = timeToMinutes(node.endTime || '09:30');

        setDragState({
          id: node.id,
          startX: e.clientX,
          origStartMin: startMin,
          origDuration: Math.max(15, endMin - startMin),
          previewStartTime: minutesToTime(startMin),
          previewEndTime: minutesToTime(Math.max(startMin + 15, endMin))
        });
      };

      const handlePointerMove = (e) => {
        if (!dragState) return;
        const deltaX = (e.clientX - dragState.startX) / zoom;
        const deltaMinutes = Math.round(((deltaX / PIXELS_PER_HOUR) * 60) / 15) * 15;

        let newStartMin = Math.max(0, Math.min(24 * 60 - dragState.origDuration, dragState.origStartMin + deltaMinutes));
        newStartMin = Math.round(newStartMin / 15) * 15;
        const nextStartStr = minutesToTime(newStartMin);
        const nextEndStr = minutesToTime(newStartMin + dragState.origDuration);

        if (nextStartStr !== dragState.previewStartTime || nextEndStr !== dragState.previewEndTime) {
          setDragState(prev => prev ? { ...prev, previewStartTime: nextStartStr, previewEndTime: nextEndStr } : null);
        }
      };

      const handlePointerUp = (e) => {
        if (dragState) {
          if (e.currentTarget.hasPointerCapture?.(e.pointerId)) {
            e.currentTarget.releasePointerCapture(e.pointerId);
          }
          if (dragState.previewStartTime !== minutesToTime(dragState.origStartMin)) {
            const { id, previewStartTime, previewEndTime } = dragState;
            dispatchTreeUpdate(prev => updateNodeInTree(prev, id, {
              startTime: previewStartTime,
              endTime: previewEndTime
            }));
          }
          setDragState(null);
        }

      // 背景パン移動

      const handleCanvasPointerUp = () => {

      const closeModal = () => setModalState({ isOpen: false, type: '', targetNodeId: null });

      // === PART 2 END (この直下にパート3を貼り付けてください) ===
    if (!isAuthenticated) {

          {activeMainTab === 'timeline' && (

                <div
                  className="relative h-full"
                  style={{
                    width: `${canvasWidth * zoom}px`,
                    transform: `translateX(-${scrollLeft}px)`
                  }}
                >
                  {Array.from({ length: totalHours + 1 }).map((_, idx) => {
                    const hour = timelineStartHour + idx;
                    const posX = (idx * PIXELS_PER_HOUR + 60) * zoom;
                    return (
                      <div
                        key={hour}
                        className="absolute border-l border-slate-300 h-full flex items-center pl-1.5"
                        style={{ left: `${posX}px` }}
                      >
                        <span className="text-xs font-mono font-bold text-slate-600">
                          {String(hour).padStart(2, '0')}:00
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Main Canvas */}
              <div
                ref={mainScrollRef}
                onScroll={(e) => setScrollLeft(e.currentTarget.scrollLeft)}
                onPointerDown={handleCanvasPointerDown}
                onPointerMove={handleCanvasPointerMove}
                onPointerUp={handleCanvasPointerUp}
                onPointerLeave={handleCanvasPointerUp}
                className={`flex-1 min-h-0 min-w-0 overflow-auto relative select-none ${
                  panState ? 'cursor-grabbing' : 'cursor-grab'
                }`}
              >
                <div
                  style={{
                    width: `${canvasWidth * zoom}px`,
                    height: `${layout.totalHeight * zoom}px`,
                    position: 'relative'
                  }}
                >
                  <div
                    className="relative origin-top-left transition-transform duration-75"
                    style={{
                      width: `${canvasWidth}px`,
                      height: `${layout.totalHeight}px`,
                      transform: `scale(${zoom})`,
                      transformOrigin: '0 0'
                    }}
                  >
                    {/* 背景グリッド線 */}
                    <div className="absolute inset-0 pointer-events-none">
                      {Array.from({ length: totalHours + 1 }).map((_, idx) => (
                        <div
                          key={idx}
                          className="absolute top-0 bottom-0 border-l border-slate-200/60"
                          style={{ left: `${idx * PIXELS_PER_HOUR + 60}px` }}
                        />
                      ))}
                    </div>

                    {/* 接続線SVG */}
                    <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                      {layout.links.map(link => {
                        const controlX1 = link.startX + Math.max(30, (link.endX - link.startX) / 2);
                        const controlX2 = link.endX - Math.max(30, (link.endX - link.startX) / 2);
                        const pathD = `M ${link.startX} ${link.startY} C ${controlX1} ${link.startY}, ${controlX2} ${link.endY}, ${link.endX} ${link.endY}`;
                        return (
                          <g key={link.id}>
                            <path
                              d={pathD}
                              fill="none"
                              stroke={getColorStroke(link.colorClass)}
                              strokeWidth="4"
                              strokeLinecap="round"
                              className="transition-all duration-300"
                            />
                            <path
                              d={pathD}
                              fill="none"
                              stroke="#ffffff"
                              strokeWidth="1.5"
                              strokeLinecap="round"
                              strokeDasharray="4 4"
                              className="opacity-60"
                            />
                          </g>
                        );
                      })}
                    </svg>

                    {/* 分岐カード群 */}
                    {layout.nodes.map(item => {
                      const { node, x, y, width, height, displayStartTime, displayEndTime } = item;
                      const currentFeatures = parseFeatures(node.features || node.feature);
                      const isDragging = dragState?.id === node.id;

                      return (
                        <div
                          key={node.id}
                          data-node-card="true"
                          onPointerDown={(e) => handlePointerDown(e, node)}
                          onPointerMove={handlePointerMove}
                          onPointerUp={handlePointerUp}
                          className={`absolute z-20 rounded-2xl border shadow-sm flex flex-col justify-between p-3.5 transition-shadow cursor-grab active:cursor-grabbing ${node.color || 'bg-white'} ${
                            isDragging ? 'shadow-2xl ring-2 ring-blue-500 z-40' : 'hover:shadow-md hover:border-slate-300'
                          }`}
                          style={{
                            left: `${x}px`,
                            top: `${y - (height / 2)}px`,
                            width: `${width}px`,
                            minHeight: `${height}px`,
                            touchAction: 'none'
                          }}
                        >
                          <div>
                            <div className="flex items-start justify-between gap-1.5 pb-2 border-b border-slate-900/10">
                              <div className="flex items-start gap-1.5 min-w-0 flex-1">
                                <span className="text-slate-400 mt-0.5 shrink-0 cursor-grab">
                                  <DragIcon />
                                </span>
                                <div className="min-w-0 flex-1">
                                  <h3 className="font-extrabold text-slate-800 text-sm leading-snug break-words whitespace-normal">
                                    {node.title}
                                  </h3>
                                  <div className="mt-1">
                                    <span className="inline-block px-1.5 py-0.5 bg-slate-900/5 text-slate-700 rounded text-[10px] font-mono font-semibold">
                                      {displayStartTime} - {displayEndTime}
                                    </span>
                                  </div>
                                </div>
                              </div>

                              <div className="flex items-center gap-0.5 shrink-0">
                                <button
                                  onClick={() => handleCopyNode(node)}
                                  className="p-1 hover:bg-slate-900/10 rounded text-slate-600 transition-colors"
                                  title="この分岐をコピー"
                                >
                                  <CopyIcon />
                                </button>
                                <button
                                  onClick={() => handleEditClick(node)}
                                  className="p-1 hover:bg-slate-900/10 rounded text-slate-600 transition-colors"
                                  title="編集"
                                >
                                  <EditIcon />
                                </button>
                                {node.id !== 'root' && (
                                  <button
                                    onClick={() => handleDeleteClick(node.id)}
                                    className="p-1 hover:bg-red-500/10 rounded text-red-600 transition-colors"
                                    title="削除"

                                    <TrashIcon />
                                  </button>
                                )}
                              </div>
                            </div>

                            {node.id !== 'root' && (
                              <div className="flex items-center justify-end gap-1 py-1 border-b border-slate-900/5 text-[10px] text-slate-600">
                                <span className="text-[9px] text-slate-400 mr-auto">階層・並び順</span>
                                <button onClick={() => handleReorderClick(node.id, -1)} className="p-0.5 hover:bg-slate-900/10 rounded" title="上に移動">
                                  <ArrowUpIcon />
                                </button>
                                <button onClick={() => handleReorderClick(node.id, 1)} className="p-0.5 hover:bg-slate-900/10 rounded" title="下に移動">
                                  <ArrowDownIcon />
                                </button>
                                <button onClick={() => handlePromoteClick(node.id)} className="p-0.5 hover:bg-slate-900/10 rounded" title="上の階層へ昇格">
                                  <ArrowLeftIcon />
                                </button>
                                <button onClick={() => handleDemoteClick(node.id)} className="p-0.5 hover:bg-slate-900/10 rounded" title="下の階層へ降格">
                                  <ArrowRightIcon />
                                </button>
                              </div>
                            )}

                            {node.description && (
                              <p className="text-xs text-slate-600 my-2 leading-relaxed break-words whitespace-pre-wrap">
                                {node.description}
                              </p>
                            )}

                            {(node.aiWith || node.aiWithout) && (
                              <div className="my-2 space-y-1.5 text-xs">
                                {node.aiWith && (
                                  <div className="bg-white/80 border border-emerald-500/20 rounded-lg p-2 text-slate-700">
                                    <div className="font-bold text-emerald-700 text-[11px] mb-0.5">🟢 AIあり (〇〇さん)</div>
                                    <p className="leading-snug break-words whitespace-pre-wrap text-[11px]">{node.aiWith}</p>
                                  </div>
                                )}
                                {node.aiWithout && (
                                  <div className="bg-white/80 border border-rose-500/20 rounded-lg p-2 text-slate-700">
                                    <div className="font-bold text-rose-700 text-[11px] mb-0.5">🔴 AIなし (××さん)</div>
                                    <p className="leading-snug break-words whitespace-pre-wrap text-[11px]">{node.aiWithout}</p>
                                  </div>
                                )}
                              </div>

                            {currentFeatures.length > 0 && (
                              <div className="flex flex-wrap gap-1 mt-2">
                                {currentFeatures.map((feat, i) => (
                                  <span key={i} className="px-2 py-0.5 bg-indigo-50 border border-indigo-200/60 text-indigo-700 font-semibold text-[10px] rounded-md">
                                    {feat}
                                  </span>
                                ))}
                              </div>
                            )}
                          </div>

                          <div className="mt-3 pt-2 border-t border-slate-900/10 flex flex-col gap-1">
                            <button
                              onClick={() => handleAddClick(node)}
                              className="w-full py-1.5 px-3 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 flex items-center justify-center gap-1.5 shadow-sm transition-colors"
                            >
                              <PlusIcon />
                              <span>分岐を追加</span>
                            </button>

                            {copiedNode && (
                              <button
                                onClick={() => handlePasteNode(node)}
                                className="w-full py-1 px-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 rounded-lg text-[11px] font-bold text-emerald-800 flex items-center justify-center gap-1 transition-colors"
                              >
                                <CopyIcon />
                                <span>コピーをここに貼り付け</span>
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* 右下フローティング操作バー */}

                <button onClick={() => scrollHorizontal(400)} className="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-md text-xs font-bold">右 ▶</button>
              </div>
            </>
          )}

          {/* ================================================================ */}
          {/* タブ2: 活用機能マスター登録タブ                                  */}
          {/* ================================================================ */}
          {activeMainTab === 'features' && (
            <div className="flex-1 overflow-y-auto p-4 sm:p-8 select-text">
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                  <h2 className="text-base font-extrabold text-slate-800 flex items-center gap-2 mb-1">
                    <TagIcon />
                    <span>活用機能の登録（マスター管理）</span>
                  </h2>
                  <p className="text-xs text-slate-500 mb-4">

                  </p>

                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      handleAddMasterFeatures(masterFeatureInput);
                    }}
                    className="flex gap-2"
                  >
                    <input
                      type="text"
                      value={masterFeatureInput}
                      onChange={(e) => setMasterFeatureInput(e.target.value)}
                      placeholder="例: かこって検索, 編集マジック, リアルタイム翻訳（カンマ区切りで複数一括登録可）"
                      className="flex-1 px-3.5 py-2 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-sm transition-colors flex items-center gap-1.5 shrink-0"
                    >
                      <PlusIcon />
                      <span>登録する</span>
                    </button>
                  </form>
                </div>

                    <h3 className="text-sm font-bold text-slate-800">
                      登録済みの活用機能（{registeredFeatures.length}件）
                    </h3>
                    <span className="text-[11px] text-slate-400">名前変更・削除は全タイムラインへ反映されます</span>
                  </div>

                  {registeredFeatures.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-8">
                      まだ活用機能が登録されていません。上のフォームから追加してください。
                    </p>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {registeredFeatures.map(feat => {
                        const isEditing = editingMasterFeat === feat;
                        return (
                          <div
                            key={feat}
                            className="flex items-center justify-between gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                          >
                            {isEditing ? (
                              <div className="flex items-center gap-1.5 flex-1">
                                <input
                                  type="text"
                                  value={editingMasterFeatVal}
                                  onChange={(e) => setEditingMasterFeatVal(e.target.value)}
                                  className="flex-1 px-2.5 py-1 border border-indigo-400 rounded-lg text-xs bg-white focus:outline-none"
                                  autoFocus
                                />
                                <button
                                  type="button"
                                  onClick={() => handleRenameMasterFeature(feat, editingMasterFeatVal)}
                                  className="px-2.5 py-1 bg-indigo-600 text-white text-xs font-bold rounded-lg"
                                >
                                  保存
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setEditingMasterFeat(null)}
                                  className="px-2 py-1 bg-slate-200 text-slate-600 text-xs font-bold rounded-lg"
                                >
                                  取消
                                </button>
                              </div>
                            ) : (
                              <>
                                <span className="text-xs font-bold text-indigo-800 bg-indigo-50 border border-indigo-200/70 px-2.5 py-1 rounded-lg truncate">
                                  {feat}
                                </span>
                                <div className="flex items-center gap-1 shrink-0">
                                  <button
                                    onClick={() => {
                                      setEditingMasterFeat(feat);
                                      setEditingMasterFeatVal(feat);
                                    }}
                                    className="p-1.5 hover:bg-slate-200 rounded-lg text-slate-600 transition-colors"
                                    title="機能名を変更"
                                  >
                                    <EditIcon />
                                  </button>
                                  <button
                                    onClick={() => handleDeleteMasterFeature(feat)}
                                    className="p-1.5 hover:bg-rose-100 rounded-lg text-rose-600 transition-colors"
                                    title="削除"
                                  >
                                    <TrashIcon />
                                  </button>
                                </div>
                              </>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================================================================ */}
          {/* タブ3: シチュエーションストックタブ                              */}
          {/* ================================================================ */}
          {activeMainTab === 'stocks' && (
            <div className="flex-1 overflow-y-auto p-4 sm:p-8 select-text">
              <div className="max-w-5xl mx-auto space-y-5">
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h2 className="text-base font-extrabold text-slate-800 flex items-center gap-2">
                      <BookmarkIcon />
                      <span>シチュエーションストック</span>
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      よく使う場面やアイデアをストックしておき、現在のタイムライン（<strong className="text-slate-700">{activeTimeline.name}</strong>）の任意の分岐配下へすぐ追加できます。
                    </p>
                  </div>
                  <button
                    onClick={openCreateStockModal}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm transition-colors flex items-center gap-1.5"
                  >
                    <PlusIcon />
                    <span>新しいストックを作成</span>
                  </button>
                </div>

                {situationStocks.length === 0 ? (
                  <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center">
                    <p className="text-sm font-bold text-slate-500 mb-1">ストックがまだありません</p>
                    <p className="text-xs text-slate-400 mb-4">よく使うシチュエーションを登録しておくと、タイムライン作成がスムーズになります。</p>
                    <button
                      onClick={openCreateStockModal}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl"
                    >
                      最初のストックを作成
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {situationStocks.map(stock => {
                      const feats = parseFeatures(stock.features);
                      const selectedParent = stockInsertTarget[stock.id] || flatActiveNodes[0]?.id || 'root';
                      return (
                        <div
                          key={stock.id}
                          className={`rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-col justify-between ${stock.color || 'bg-white'}`}
                        >
                          <div>
                            <div className="flex items-start justify-between gap-2 pb-2 border-b border-slate-900/10">
                              <div>
                                <h3 className="font-extrabold text-slate-800 text-sm">{stock.title}</h3>
                                <span className="inline-block mt-1 px-1.5 py-0.5 bg-slate-900/5 text-slate-600 rounded text-[10px] font-mono font-semibold">
                                  目安: {stock.durationMin || 30}分
                                </span>
                              </div>
                              <div className="flex items-center gap-0.5 shrink-0">
                                <button
                                  onClick={() => openEditStockModal(stock)}
                                  className="p-1 hover:bg-slate-900/10 rounded text-slate-600"
                                  title="編集"
                                >
                                  <EditIcon />
                                </button>
                                <button
                                  onClick={() => handleDeleteStock(stock.id)}
                                  className="p-1 hover:bg-rose-500/10 rounded text-rose-600"
                                  title="削除"
                                >
                                  <TrashIcon />
                                </button>
                              </div>
                            </div>

                              <p className="text-xs text-slate-600 my-2 whitespace-pre-wrap leading-relaxed">
                                {stock.description}

                              <div className="my-2 space-y-1.5">
                                {stock.aiWith && (
                                  <div className="bg-white/80 border border-emerald-500/20 rounded-lg p-2">
                                    <div className="font-bold text-emerald-700 text-[10px] mb-0.5">🟢 AIあり</div>
                                    <p className="text-[11px] text-slate-700 whitespace-pre-wrap">{stock.aiWith}</p>
                                  </div>
                                )}
                                {stock.aiWithout && (
                                  <div className="bg-white/80 border border-rose-500/20 rounded-lg p-2">
                                    <div className="font-bold text-rose-700 text-[10px] mb-0.5">🔴 AIなし</div>
                                    <p className="text-[11px] text-slate-700 whitespace-pre-wrap">{stock.aiWithout}</p>
                                  </div>
                                )}
                              </div>

                              <div className="flex flex-wrap gap-1 mt-2">

                            <button
                              onClick={() => handleInsertStockToTimeline(stock)}
                              className="w-full py-2 px-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition-colors"

                              <PlusIcon />
                              <span>この分岐の配下に追加する</span>
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ================================================================ */}
          {/* モーダル群                                                       */}
          {/* ================================================================ */}

          {/* 1. タイムラインVer作成 / 名前変更 / 削除モーダル */}
          {versionModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 select-text">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
                {versionModal.mode === 'delete' ? (
                  <div>
                    <h2 className="text-base font-bold text-slate-800 mb-2">タイムラインVerの削除</h2>

                        className="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"

                      <button
                        type="button"
                        onClick={handleConfirmVersionModal}

                      <label className="block text-xs font-bold text-slate-700 mb-1">バージョン名</label>
                      <input
                        type="text"
                        value={versionModal.name}
                        onChange={(e) => setVersionModal({ ...versionModal, name: e.target.value })}
                        placeholder="例: Ver 2.0 (短縮版)"
                        required
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    {versionModal.mode === 'create' && (

                      value={pwForm.confirmPassword}
                      onChange={(e) => {
                        setPwForm({ ...pwForm, confirmPassword: e.target.value });
                        if (pwError) setPwError('');
                      }}
                      placeholder="もう一度新しいパスワードを入力（ペースト可）"
                      required
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 select-text"
                    />
                  </div>

                  {pwError && (
                    <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold px-3 py-2 rounded-lg">
                      {pwError}
                    </div>
                  )}

                  <div className="pt-2 flex items-center justify-between gap-2 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={handleResetCredentials}
                      className="text-[11px] text-slate-500 hover:text-slate-700 underline"
                    >
                      初期設定に戻す
                    </button>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsPasswordModalOpen(false)}
                        className="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
                      >
                        キャンセル
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
                      >
                        変更を保存
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 5. 共有ルーム設定モーダル */}
          {isRoomModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 select-text">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
                <h2 className="text-lg font-bold text-slate-800 mb-1">複数人同期用の「合言葉（ルームID）」</h2>
                <p className="text-xs text-slate-500 mb-4">
                  Googleアカウント不要で、同じ合言葉（または共有URL）を開いたメンバー全員とリアルタイムに共同編集できます。
                </p>
                <input
                  type="text"
                  value={inputRoomId}
                  onChange={(e) => setInputRoomId(e.target.value)}
                  placeholder="例: team-a, workshop-1"
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-4"
                />
                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setIsRoomModalOpen(false)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
                  >
                    キャンセル
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const cleaned = inputRoomId.trim() || 'default-room';
                      setRoomId(cleaned);
                      setIsRoomModalOpen(false);
                      showToast(`合言葉「${cleaned}」に切り替えて自動保存を開始しました`);
                    }}
                    className="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
                  >
                    この合言葉で同期接続
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ParallelApp />);
  </script>
</body>
</html>
